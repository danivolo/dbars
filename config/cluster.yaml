# Cluster paths (layout listed by the user on 2026-10-18: ~/bars has groups_091..099 and extracted_galaxies[_snapNN] for
# 91..99; 00_check_data.py confirms completeness). Loaded over default.yaml.
include: default.yaml
snapshots: [99, 98]          # 97-91: empty folders on the cluster (00_check_data, 2026-10-19; DECISIONS D16)
paths:
  base: ~/bars/TNG50-1/output
  offsets: ~/bars/TNG50-1/postprocessing/offsets
  cutouts: ~/astro/data/bars/stars_snap{snap}   # star cutouts from scripts/fetch_cutouts.py (searched first; ~/bars stays read-only)
  stars_npz:                                      # legacy extraction (searched second)
    99: ~/bars/extracted_galaxies
    98: ~/bars/extracted_galaxies_snap98
    97: ~/bars/extracted_galaxies_snap97
    96: ~/bars/extracted_galaxies_snap96
    95: ~/bars/extracted_galaxies_snap95
    94: ~/bars/extracted_galaxies_snap94
    93: ~/bars/extracted_galaxies_snap93
    92: ~/bars/extracted_galaxies_snap92
    91: ~/bars/extracted_galaxies_snap91
  zana_bars: ~/bars/extra_data/morphs_kinematic_bars.hdf5   # Zana et al. 2022 bar catalogue, merged by 03_classify.py
  outputs: ~/astro/runs/bars/manual          # only for runs by hand; jobs use $ASTRO_RUNDIR
